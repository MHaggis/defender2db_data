name: Update ASR Lua

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install defender2db
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/dobin/defender2db@main"

      - name: Fetch luadec (Linux)
        run: |
          mkdir -p scripts/bin
          curl -fsSL -o scripts/bin/luadec https://raw.githubusercontent.com/dobin/defender2db/main/luadec
          chmod +x scripts/bin/luadec

      - name: Run updater (download, extract, decompile)
        env:
          LUADEC: ${{ github.workspace }}/scripts/bin/luadec
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_CONFIG_FILE: /dev/null
        run: |
          python scripts/update_asr.py --no-install

      - name: Build RMM index
        run: |
          python scripts/scan_rmm.py

      - name: Cross-reference with LOLRMM dataset
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_CONFIG_FILE: /dev/null
        run: |
          python scripts/scan_lolrmm.py

      - name: Generate RMM summary
        run: |
          python scripts/generate_summary.py

      - name: Dump ASR artifacts
        run: |
          python scripts/dump_asr.py

      - name: Extract all indicators
        run: |
          python scripts/extract_all_indicators.py

      - name: Extract unknown indicators
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_CONFIG_FILE: /dev/null
        run: |
          python scripts/extract_unknown_indicators.py

      - name: Map indicators to IDs
        run: |
          python scripts/map_indicators_to_ids.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A asr_lua/ asr_index.csv asr_rmm_index.csv asr_rmm_summary.csv \
            asr_rmm_lolrmm_matches.csv asr_dump.json asr_dump.csv \
            asr_indicator_id_map.csv asr_indicators_all_with_names.csv \
            asr_indicators_unknown.csv asr_indicators_unknown_with_names.csv \
            asr_targets_from_txt.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ASR Lua and analysis artifacts [$(date -u +%Y-%m-%d)]"
            git push
          fi


